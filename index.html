
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bike Image Slider</title>

    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <h1>Bike Image Slider</h1>
    <p>Explore Five Different Motorcycles</p>

    <div class="slider">

        <div class="slider-track">
            

            <div class="slide">
                <img src="Images/Kawasaki Ninja.jpg"
                     alt="Motorcycle 1 - Kawasaki Ninja">
                <h2>Kawasaki Ninja</h2>
            </div>

            <div class="slide">
                <img src="Images/Yamaha R1.jpg"
                     alt="Motorcycle 2 - Yamaha R1">
                <h2>Yamaha R1</h2>
            </div>

            <div class="slide">
                <img src="Images/Honda CBR.jpg"
                     alt="Motorcycle 3 - Honda CBR">
                <h2>Honda CBR</h2>
            </div>

            <div class="slide">
                <img src="Images/Ducati Panigale.jpg"
                     alt="Motorcycle 4 - Ducati Panigale">
                <h2>Ducati Panigale</h2>
            </div>

            <div class="slide">
                <img src="Images/BMW S1000RR.jpg"
                     alt="Motorcycle 5 - BMW S1000RR">
                <h2>BMW S1000RR</h2>
            </div>

        </div>

        <button class="prev" aria-label="Previous bike">&#10094;</button>
        <button class="next" aria-label="Next bike">&#10095;</button>

    </div>

    <div class="dots"></div>

</body>
</html>
